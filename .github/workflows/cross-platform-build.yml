name: Cross-platform build

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cross-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: lameta-windows-x64
            command: yarn electron-builder --win nsis --x64 --publish never
          - name: macOS universal
            os: macos-latest
            artifact: lameta-macos-universal
            command: yarn electron-builder --mac dmg zip --universal --publish never -c.mac.notarize=false
          - name: Linux x64
            os: ubuntu-latest
            artifact: lameta-linux-x64
            command: yarn electron-builder --linux AppImage deb --x64 --publish never

    env:
      # These are artifact builds, not signed releases.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js and Yarn from package.json
        uses: volta-cli/action@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Build application
        run: yarn fullbuild

      - name: Package application
        run: ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.blockmap
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.zip
